<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow border-0 rounded-4 p-4">
                <h3 class="fw-bold mb-3 text-center">Password Generator</h3>
                <div class="mb-3">
                    <label for="length" class="form-label d-flex justify-content-between small fw-semibold">
                        <span>Length</span>
                        <span class="badge bg-primary">{{ length() }}</span>
                    </label>
                    <input type="range" class="form-range" id="length" min="4" max="30" [value]="length()"
                        (input)="updateLength($event)" />
                </div>

                <!-- Checkbox Options -->
                <div class="vstack gap-2 mb-3">
                    <div class="form-check">
                        <input type="checkbox" id="includeUppercase" class="form-check-input"
                            [checked]="includeUppercase()" (change)="toggleOption('includeUppercase', $event)" />
                        <label for="includeUppercase" class="form-check-label small">Include Uppercase Letters
                            (A-Z)</label>
                    </div>

                    <div class="form-check">
                        <input type="checkbox" id="includeLowercase" class="form-check-input"
                            [checked]="includeLowercase()" (change)="toggleOption('includeLowercase', $event)" />
                        <label for="includeLowercase" class="form-check-label small">Include Lowercase Letters
                            (a-z)</label>
                    </div>

                    <div class="form-check">
                        <input type="checkbox" id="includeNumbers" class="form-check-input" [checked]="includeNumbers()"
                            (change)="toggleOption('includeNumbers', $event)" />
                        <label for="includeNumbers" class="form-check-label small">Include Numbers (0-9)</label>
                    </div>

                    <div class="form-check">
                        <input type="checkbox" id="includeSymbols" class="form-check-input" [checked]="includeSymbols()"
                            (change)="toggleOption('includeSymbols', $event)" />
                        <label for="includeSymbols" class="form-check-label small">Include Symbols (!@#$%^&*)</label>
                    </div>
                </div>

                <button type="button" (click)="generatePassword()"
                    class="btn btn-primary btn-sm w-100 py-2 mb-3 fw-semibold">
                    <i class="bi bi-shield-lock me-2" aria-hidden="true"></i> Generate Password
                </button>

                @if (generatedPassword()) {
                <div class="p-3 bg-light rounded-3 border text-break font-monospace small text-center select-all">
                    {{ generatedPassword() }}
                </div>
                }
            </div>
        </div>
    </div>
</div>





<footer class="footer mt-5 py-4 bg-light text-center border-top">
    <div class="container">
        <a routerLink="/" class="text-decoration-none fw-semibold text-primary">
            Back to Home
        </a>
    </div>
</footer>
