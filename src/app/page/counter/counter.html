<div class="container text-center mt-5">
    <div class="card shadow-lg">
        <div class="card-body">
            <h1 class="mb-4">Counter App</h1>

            <h2 class="display-4 mb-4 count-display" [class]="countColor()">
                {{ count() }}
            </h2>

            <div class="counter-actions d-flex justify-content-center gap-3">
                <button type="button" class="btn btn-outline-success increment-btn" (click)="increment()">
                    <i class="bi bi-plus-circle me-2" aria-hidden="true"></i>
                    Increment
                </button>

                <button type="button" class="btn btn-outline-danger decrement-btn" (click)="decrement()">
                    <i class="bi bi-dash-circle me-2" aria-hidden="true"></i>
                    Decrement
                </button>

                <button type="button" class="btn btn-outline-secondary reset-btn" (click)="reset()">
                    <i class="bi bi-arrow-clockwise me-2" aria-hidden="true"></i>
                    Reset
                </button>
            </div>
        </div>
    </div>
</div>




<footer class="footer mt-5 py-4 bg-light text-center border-top">
    <div class="container">
        <a routerLink="/" class="text-decoration-none fw-semibold text-primary">
            Back to Home
        </a>
    </div>
</footer>
