<div class="container py-4">
    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 mb-0">Dashboard Overview</h2>
        <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2">
            System Online
        </span>
    </div>

    <!-- Metrics Row -->
    <div class="row g-4 mb-4">
        <!-- Card 1 -->
        <div class="col-md-4">
            <div class="card border-0 shadow-sm bg-body-tertiary">
                <div class="card-body">
                    <h6 class="text-muted text-uppercase fs-7 mb-2">Total Users</h6>
                    <h3 class="fw-bold mb-0">{{ totalUsers() | number }}</h3>
                </div>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="col-md-4">
            <div class="card border-0 shadow-sm bg-body-tertiary">
                <div class="card-body">
                    <h6 class="text-muted text-uppercase fs-7 mb-2">Active Sessions</h6>
                    <h3 class="fw-bold mb-0">{{ activeSessions() }}</h3>
                </div>
            </div>
        </div>

        <!-- Card 3 -->
        <div class="col-md-4">
            <div class="card border-0 shadow-sm bg-body-tertiary">
                <div class="card-body">
                    <h6 class="text-muted text-uppercase fs-7 mb-2">Server Uptime</h6>
                    <h3 class="fw-bold mb-0">{{ serverUptime() }}</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- Recent Activities Section -->
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-transparent border-0 pt-4 px-4">
            <h5 class="mb-0">Recent Activities</h5>
        </div>
        <div class="card-body px-4">
            <ul class="list-group list-group-flush">
                @for (activity of recentActivities(); track activity.id) {
                <li class="list-group-item d-flex justify-content-between align-items-center bg-transparent py-3">
                    <span>{{ activity.text }}</span>
                    <small class="text-muted">{{ activity.time }}</small>
                </li>
                }
            </ul>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="footer mt-5 py-4 bg-light text-center border-top">
    <div class="container">
        <a routerLink="/" class="text-decoration-none fw-semibold text-primary">
            Back to Home
        </a>
    </div>
</footer>
