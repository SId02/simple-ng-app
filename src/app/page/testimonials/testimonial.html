<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <div
                class="testimonial-wrapper text-center shadow-sm p-4 p-md-5 bg-body-tertiary rounded-4 position-relative">

                <div class="image-container mb-4">
                    <img [src]="activeTestimonial().image" class="rounded-circle shadow" alt="User Image">
                </div>

                <div class="testimonial-content mb-4">
                    <blockquote class="blockquote">
                        <p class="lead italic">"{{ activeTestimonial().message }}"</p>
                        <footer class="blockquote-footer mt-2">
                            <strong>{{ activeTestimonial().name }}</strong>
                        </footer>
                    </blockquote>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <button class="btn btn-outline-secondary rounded-circle" (click)="prevTestimonial()" type="button">
                        <i class="bi bi-chevron-left"></i>
                    </button>

                    <div class="dots-container d-flex gap-2">
                        @for (item of testimonials; track $index) {
                        <span class="dot" [class.active]="$index === currentIndex()"></span>
                        }
                    </div>

                    <button class="btn btn-outline-secondary rounded-circle" (click)="nextTestimonial()" type="button">
                        <i class="bi bi-chevron-right"></i>
                    </button>
                </div>

            </div>
        </div>
    </div>
</div>





<footer class="footer mt-5 py-4 bg-light text-center border-top">
    <div class="container">
        <a routerLink="/" class="text-decoration-none fw-semibold text-primary">
            Back to Home
        </a>
    </div>
</footer>
